<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c91518">
<link rel="manifest" href="manifest.json">
<title>Passenger Counts</title>
<style>
:root{--red:#c91518;--deep:#10202b;--cream:#f7f3e8;--green:#15863f;--line:#d8dde0}
*{box-sizing:border-box}body{margin:0;background:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14202a}
.app{max-width:600px;margin:auto;min-height:100vh;background:var(--cream)}
header{background:linear-gradient(135deg,#dc201f,#ae1015);color:white;padding:14px 18px 12px;box-shadow:0 2px 8px #0004}
.head{display:flex;align-items:center;justify-content:space-between}.brand{font-size:29px;font-weight:900;letter-spacing:-1.5px}.actions{display:flex;gap:9px}
.action{width:60px;height:60px;border:0;border-radius:13px;background:#fff;color:var(--deep);font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:pointer}.action small{font-size:11px;margin-top:2px}
.tabs{display:flex;background:#e5e7e8;margin:10px 12px;border-radius:16px;padding:5px;gap:5px}.tab{flex:1;border:0;background:transparent;padding:12px 5px;border-radius:12px;font-size:15px;font-weight:850;color:#26323a;cursor:pointer}.tab.active{background:var(--red);color:white}
.hero{height:175px;position:relative;overflow:hidden;background:linear-gradient(#47849a 0%,#8bb8c4 48%,#f8df91 49%,#f7f1df 100%);border-bottom:6px solid #fff}
.cloud{position:absolute;background:#fff7d8;border-radius:50px;opacity:.9}.c1{width:150px;height:35px;top:30px;right:25px}.c2{width:100px;height:25px;top:72px;right:130px}
.clock{position:absolute;width:155px;height:155px;top:18px;left:18px;border:10px solid #10202b;border-radius:50%;background:#fff8dc;box-shadow:0 0 0 4px #f2c83d}.clock:before,.clock:after{content:"";position:absolute;left:50%;top:50%;background:#10202b;transform-origin:left center;border-radius:4px}.clock:before{width:47px;height:7px;transform:rotate(30deg)}.clock:after{width:39px;height:7px;transform:rotate(215deg)}
.train{position:absolute;right:18px;bottom:15px;width:350px;height:108px;background:linear-gradient(90deg,#f2f0df 0 44%,#d71918 44% 58%,#f5c633 58%);border-radius:55px 85px 25px 20px;transform:skewX(-5deg);box-shadow:0 10px 0 #172732}.train:after{content:"";position:absolute;right:22px;top:18px;width:75px;height:48px;background:#173342;border-radius:35px 35px 18px 18px}.train:before{content:"";position:absolute;left:35px;top:35px;width:120px;height:25px;background:repeating-linear-gradient(90deg,#10202b 0 10px,transparent 10px 16px)}
.page{padding:12px;width:100%;max-width:100%}.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;max-width:100%}.field{width:100%;max-width:100%;box-sizing:border-box}.field{border-radius:16px;padding:10px;color:white}.first{background:linear-gradient(135deg,#b51a1e,#851014)}.standard{background:linear-gradient(135deg,#273843,#13212a)}
.field-title{font-size:18px;font-weight:900;text-align:center}.count-input{border:0;text-align:center;outline:none;font-family:inherit}.count-input:focus{box-shadow:0 0 0 3px #f5c633}.seat{font-size:25px;margin-right:7px}.value{width:100%;max-width:100%;box-sizing:border-box;height:64px;margin:8px 0;background:#fff;color:#17212a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}.controls{display:flex;justify-content:space-between;gap:10px}.controls button{width:52px;height:52px;border-radius:50%;border:0;color:white;font-size:34px;font-weight:700;cursor:pointer}.minus{background:#e52328}.plus{background:#159142}
.total{width:100%;max-width:100%;box-sizing:border-box;margin-top:13px;border-radius:18px;background:linear-gradient(135deg,#eef0f1,#dfe4e7);padding:12px;text-align:center}.total-title{font-size:19px;font-weight:850}.total-value{font-size:46px;font-weight:950;transition:color .2s ease}.load-low{color:#15863f}.load-medium{color:#d98900}.load-high{color:#d71918}.load-info{font-size:13px;font-weight:800;color:#5d6971;margin-top:-4px}
.notes{width:100%;max-width:100%;box-sizing:border-box;margin-top:14px;border-radius:18px;background:var(--deep);padding:12px}.notes label{display:block;color:white;font-weight:850;font-size:18px;margin-bottom:9px}.notes textarea{width:100%;height:105px;border-radius:12px;border:1px solid #b8c0c4;padding:12px;font:inherit;resize:none}
.savebar{display:block;box-sizing:border-box;margin-top:14px;width:100%;max-width:100%;border:0;background:var(--red);color:white;border-radius:15px;padding:16px;font-size:18px;font-weight:900;cursor:pointer}.message{text-align:center;color:#13723a;font-weight:800;font-size:13px;min-height:18px;padding-top:8px}
.saved-title{font-size:25px;font-weight:950;margin:16px 0 10px}.record{background:#fff;border:1px solid #d5dbde;border-radius:15px;padding:13px;margin-bottom:10px}.record b{font-size:16px}.row{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:14px}.fc{color:#b0161b;font-weight:850}.std{color:#15863f;font-weight:850}.note{color:#53606a;font-size:13px;margin-top:6px}.footer{text-align:center;padding:22px;color:#b7191c;font-weight:950;font-size:22px}.hidden{display:none}
@media(max-width:420px){
      .head{align-items:flex-start}.brand{font-size:24px;line-height:1.05}
      .actions{gap:6px}.action{width:52px;height:52px;font-size:21px}.action small{font-size:10px}
      .journey-fields{grid-template-columns:1fr!important}
      .hero{height:145px}.clock{transform:scale(.78);transform-origin:top left;top:12px;left:10px}
      .train{transform:scale(.78) skewX(-5deg);transform-origin:bottom right;right:-22px;bottom:8px}
      .tabs{margin:8px 10px}.tab{padding:9px 4px}
    }
    
/* Compact single-screen mobile layout */
.app{height:100dvh;min-height:100dvh;overflow:hidden}
header{padding:8px 12px 7px}
.brand{font-size:23px}
.actions{gap:6px}
.action{width:48px;height:48px;border-radius:11px;font-size:19px}
.action small{font-size:9px}
.tabs{margin:6px 10px;padding:3px;border-radius:12px}
.tab{padding:6px 4px;font-size:12px}
.hero{height:88px;border-bottom-width:3px}
.clock{transform:scale(.43)!important;transform-origin:top left;top:5px!important;left:5px!important}
.train{transform:scale(.48) skewX(-5deg)!important;transform-origin:bottom right;right:-55px!important;bottom:0!important}
.c1,.c2{display:none}
.page{padding:7px 10px!important;width:100%}
.journey-fields{grid-template-columns:1fr 1fr!important;gap:7px!important;margin-bottom:7px!important}
.journey-fields label,.page label{font-size:12px!important;margin-bottom:3px!important}
.journey-fields input{padding:7px!important;font-size:14px!important;border-radius:9px!important}
#station{font-size:13px!important}
#station::placeholder{font-size:12px}
#station+*{}
select#setType{padding:7px!important;font-size:14px!important;border-radius:9px!important}
.page>div[style*="margin-bottom:14px"]{margin-bottom:7px!important}
.fields{gap:7px!important;width:100%!important}
.field{padding:7px 9px!important;border-radius:12px!important;width:100%!important}
.field-title{font-size:14px!important}
.seat{font-size:17px!important}
.value{height:43px!important;margin:4px 0!important;border-radius:8px!important;font-size:28px!important}
.controls{gap:7px!important}
.controls button{width:38px!important;height:38px!important;font-size:25px!important}
.total{margin-top:7px!important;padding:7px!important;border-radius:12px!important}
.total-title{font-size:14px!important}
.total-value{font-size:31px!important;line-height:1.05}
.load-info{font-size:10px!important;margin-top:0!important}
.notes{margin-top:7px!important;padding:7px!important;border-radius:12px!important}
.notes label{font-size:13px!important;margin-bottom:4px!important}
.notes textarea{height:42px!important;min-height:42px!important;padding:7px!important;font-size:12px!important;border-radius:8px!important}
.savebar{margin-top:7px!important;padding:10px!important;border-radius:11px!important;font-size:15px!important}
.message{display:none}
.footer{display:none}
#savedView .page{max-height:calc(100dvh - 110px);overflow:auto}
@media(max-width:420px){
 .head{align-items:center}
 .journey-fields{grid-template-columns:1fr 1fr!important}
}
@media(max-height:700px){
 .hero{height:58px}
 .field{padding:5px 8px!important}
 .value{height:38px!important}
 .controls button{width:34px!important;height:34px!important}
 .notes textarea{height:34px!important;min-height:34px!important}
 .savebar{padding:8px!important}
}


.journey-fields-three{grid-template-columns:1fr 1fr 1fr!important}
@media(max-width:520px){
 .journey-fields-three{grid-template-columns:1fr 1fr!important}
 .journey-fields-three>div:last-child{grid-column:1/-1}
}
@media(max-width:420px){
 .journey-fields-three{grid-template-columns:1fr 1fr!important}
}


/* Saved report actions */
.report-actions{display:flex;gap:7px;margin:10px 0 4px}
.report-btn{border:0;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer;font-size:13px;background:#10202b;color:#fff}
.report-btn.email{background:#c91518}
.delete-entry{border:0;background:#fff;color:#c91518;font-size:24px;font-weight:900;line-height:1;width:34px;height:34px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.delete-entry:active{transform:scale(.94)}

</style>
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body><div class="app">
<header><div class="head"><div class="brand">Passenger Counts</div><div class="actions"><button class="action" id="saveTop">💾<small>Save</small></button><button class="action" id="clearTop">🗑️<small>Clear</small></button></div></div></header>
<div class="tabs"><button class="tab active" id="countTab">👥<br>Count</button><button class="tab" id="savedTab">☷<br>Saved</button></div>

<section id="countView">
<div class="hero"><div class="cloud c1"></div><div class="cloud c2"></div><div class="clock"></div><div class="train"></div></div>
<div class="page">
<div class="journey-fields journey-fields-three" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
<div>
<label for="headcode" style="display:block;font-size:17px;font-weight:900;margin:0 0 8px">🚆 Headcode</label>
<input id="headcode" placeholder="e.g. 1V50" style="width:100%;border:1px solid #d8dde0;border-radius:14px;padding:14px;font-size:20px;font-weight:800;text-transform:uppercase">
</div>
<div>
<label for="station" style="display:block;font-size:17px;font-weight:900;margin:0 0 8px">📍 Station</label>
<input id="station" placeholder="e.g. Newcastle" style="width:100%;border:1px solid #d8dde0;border-radius:14px;padding:14px;font-size:16px;font-weight:700">
</div>
<div>
<label for="countDate" style="display:block;font-size:17px;font-weight:900;margin:0 0 8px">📅 Date</label>
<input id="countDate" type="date" style="width:100%;border:1px solid #d8dde0;border-radius:14px;padding:14px;font-size:14px;font-weight:700;background:white;color:#14202a">
</div>
</div>
<div style="margin-bottom:14px">
<label for="setType" style="display:block;font-size:17px;font-weight:900;margin:0 0 8px">🚆 Formation</label>
<select id="setType" style="width:100%;border:1px solid #d8dde0;border-radius:14px;padding:14px;font-size:18px;font-weight:800;background:white;color:#14202a">
<option value="Single set">Single set</option>
<option value="Double set (FRONT)">Double set (FRONT)</option>
<option value="Double set (BACK)">Double set (BACK)</option>
</select>
</div>
<div class="fields">
<div class="field first"><div class="field-title"><span class="seat">♔</span>First Class</div><input class="value count-input" id="first" type="number" inputmode="numeric" min="0" value="0" aria-label="First Class passenger count"><div class="controls"><button class="minus" data-k="first" data-d="-1">−</button><button class="plus" data-k="first" data-d="1">+</button></div></div>
<div class="field standard"><div class="field-title"><span class="seat">♟</span>Standard</div><input class="value count-input" id="standard" type="number" inputmode="numeric" min="0" value="0" aria-label="Standard passenger count"><div class="controls"><button class="minus" data-k="standard" data-d="-1">−</button><button class="plus" data-k="standard" data-d="1">+</button></div></div>
</div>
<div class="total"><div class="total-title">👥 Total Passengers</div><div class="total-value load-low" id="total">0</div><div class="load-info" id="loadInfo">0% of Class 220 seating capacity</div></div>
<div class="notes"><label for="notes">▤ &nbsp;Notes</label><textarea id="notes" placeholder="Add notes here…"></textarea></div>
<button class="savebar" id="saveBottom">Save Passenger Count</button><div class="message" id="message"></div>
</div></section>

<section id="savedView" class="hidden"><div class="page"><div class="saved-title">Saved Passenger Counts</div><div id="history"></div></div></section>

</div>
<script>
const state={first:0,standard:0};const $=x=>document.getElementById(x);
const HEADC0DE_KEY='passengerCountsCurrentHeadcode';
const savedHeadcode=localStorage.getItem(HEADC0DE_KEY)||'';
if(savedHeadcode){$('headcode').value=savedHeadcode;}
$('headcode').addEventListener('input',()=>localStorage.setItem(HEADC0DE_KEY,$('headcode').value.trim().toUpperCase()));
$('headcode').addEventListener('change',()=>{const h=$('headcode').value.trim().toUpperCase();$('headcode').value=h;if(h)localStorage.setItem(HEADC0DE_KEY,h);else localStorage.removeItem(HEADC0DE_KEY);});
const todayLocal=()=>{const d=new Date();const off=d.getTimezoneOffset()*60000;return new Date(d-off).toISOString().slice(0,10)};
const CLASS220_CAPACITY=200;
function updateTotal(){const total=state.first+state.standard;const pct=Math.round((total/CLASS220_CAPACITY)*100);const el=$('total');el.textContent=total;el.classList.remove('load-low','load-medium','load-high');if(pct<60)el.classList.add('load-low');else if(pct<90)el.classList.add('load-medium');else el.classList.add('load-high');$('loadInfo').textContent=`${pct}% of Class 220 seating capacity`;}
function render(){$('first').value=state.first;$('standard').value=state.standard;updateTotal()}
function records(){return JSON.parse(localStorage.getItem('pc_v2')||'[]')}
function save(){const now=new Date();const selectedDate=$('countDate').value||todayLocal();
const currentHeadcode=$('headcode').value.trim().toUpperCase();
$('headcode').value=currentHeadcode;
if(currentHeadcode)localStorage.setItem(HEADC0DE_KEY,currentHeadcode);
let r={id:`pc_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,headcode:$('headcode').value.trim().toUpperCase(),station:$('station').value.trim(),setType:$('setType').value,first:state.first,standard:state.standard,total:state.first+state.standard,notes:$('notes').value.trim(),date:now.toLocaleString(),dateKey:selectedDate};let a=records();a.unshift(r);localStorage.setItem('pc_v2',JSON.stringify(a));$('message').textContent='✓ Saved offline on this device';history()}
function clearForm(){if(confirm('Clear the current count?')){state.first=state.standard=0;$('headcode').value='';localStorage.removeItem(HEADC0DE_KEY);$('station').value='';$('setType').value='Single set';$('notes').value='';$('message').textContent='Current count cleared';render()}}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function deleteEntry(id){
  if(!confirm('Delete this saved passenger count?')) return;
  let a=records();
  a=a.filter(r=>r.id!==id);
  localStorage.setItem('pc_v2',JSON.stringify(a));
  history();
}
function groupById(groupId){
  const a=records();
  const g=groupId.split('|');
  return a.filter(r=>{
    const day=r.dateKey || String(r.date||'').replace(/,.*/, '');
    const head=(r.headcode||'NO HEADC0DE').trim().toUpperCase();
    return day===g[0] && head===g[1];
  });
}
function emailGroup(groupId){
  const items=groupById(groupId);
  if(!items.length) return;
  const first=items[0];
  const totalFirst=items.reduce((n,r)=>n+(Number(r.first)||0),0);
  const totalStandard=items.reduce((n,r)=>n+(Number(r.standard)||0),0);
  const total=items.reduce((n,r)=>n+(Number(r.total)||0),0);
  const dateLabel=first.dateKey || first.date || '';
  const subject=`Passenger Counts - ${first.headcode||'Service'} - ${dateLabel}`;
  const lines=[
    `Passenger Counts`,
    `Headcode: ${first.headcode||''}`,
    `Date: ${dateLabel}`,
    '',
    `First Class: ${totalFirst}`,
    `Standard Class: ${totalStandard}`,
    `Total Passengers: ${total}`,
    '',
    'Individual counts:'
  ];
  items.forEach(r=>{
    lines.push(`${r.station||'Station not entered'} — ${r.setType||'Single set'} — First: ${r.first} | Standard: ${r.standard} | Total: ${r.total}${r.notes?' | Notes: '+r.notes:''}`);
  });
  window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines.join('\n'));
}
function pdfGroup(groupId){
  const items=groupById(groupId);
  if(!items.length) return;
  const first=items[0];
  const totalFirst=items.reduce((n,r)=>n+(Number(r.first)||0),0);
  const totalStandard=items.reduce((n,r)=>n+(Number(r.standard)||0),0);
  const total=items.reduce((n,r)=>n+(Number(r.total)||0),0);
  const dateLabel=first.dateKey
    ? new Date(first.dateKey+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})
    : esc(first.date||'');
  const rows=items.map(r=>`<tr><td>${esc(r.station||'Station not entered')}</td><td>${esc(r.setType||'Single set')}</td><td>${Number(r.first)||0}</td><td>${Number(r.standard)||0}</td><td><b>${Number(r.total)||0}</b></td><td>${esc(r.notes||'')}</td></tr>`).join('');
  const w=window.open('','_blank','width=900,height=700');
  if(!w){alert('Please allow pop-ups to create the PDF.');return;}
  w.document.write(`<!doctype html><html><head><title>Passenger Counts - ${esc(first.headcode||'Service')}</title><style>
    body{font-family:Arial,sans-serif;padding:28px;color:#14202a}h1{margin:0;color:#c91518}.meta{margin:8px 0 20px;font-weight:bold}.totals{display:flex;gap:10px;margin:16px 0}.total{border:1px solid #ddd;border-radius:8px;padding:12px;min-width:150px}.num{font-size:24px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #ddd;padding:9px;text-align:left}th{background:#10202b;color:#fff}@media print{body{padding:0}}
  </style></head><body>
  <h1>Passenger Counts</h1>
  <div class="meta">Headcode: ${esc(first.headcode||'')}<br>Date: ${dateLabel}</div>
  <div class="totals"><div class="total">First Class<div class="num">${totalFirst}</div></div><div class="total">Standard Class<div class="num">${totalStandard}</div></div><div class="total">Total Passengers<div class="num">${total}</div></div></div>
  <table><thead><tr><th>Station</th><th>Formation</th><th>First</th><th>Standard</th><th>Total</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>
  <script>window.onload=()=>window.print();<\/script></body></html>`);
  w.document.close();
}
function history(){
let a=records(),h=$('history');
if(!a.length){h.innerHTML='<div class="record">No saved passenger counts yet.</div>';return}
const groups=new Map();
a.forEach((r,index)=>{
  // Backward compatibility: give older saved records an ID the first time they are rendered.
  if(!r.id) r.id='legacy_'+index+'_'+String(r.date||'').replace(/\W/g,'');
  const day=r.dateKey || String(r.date||'').replace(/,.*/, '');
  const head=(r.headcode||'NO HEADC0DE').trim().toUpperCase();
  const key=day+'|'+head;
  if(!groups.has(key)) groups.set(key,{key,day,head,items:[]});
  groups.get(key).items.push(r);
});
localStorage.setItem('pc_v2',JSON.stringify(a));

h.innerHTML=[...groups.values()].map(g=>{
  const totalFirst=g.items.reduce((n,r)=>n+(Number(r.first)||0),0);
  const totalStandard=g.items.reduce((n,r)=>n+(Number(r.standard)||0),0);
  const totalPassengers=g.items.reduce((n,r)=>n+(Number(r.total)||0),0);
  const dateLabel=g.items[0].dateKey
    ? new Date(g.items[0].dateKey+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})
    : String(g.items[0].date||'').replace(/,.*/, '');
  const safeKey=encodeURIComponent(g.key);
  return `<div class="record" style="border:2px solid #c91518">
    <b>🚆 ${esc(g.head)}</b>
    <div class="note" style="font-weight:800;margin:5px 0 10px">${esc(dateLabel)} • ${g.items.length} count${g.items.length===1?'':'s'}</div>
    <div class="row" style="padding:9px;border-radius:10px;background:#f2f4f5">
      <span>First Class: <span class="fc">${totalFirst}</span></span>
      <span>Standard: <span class="std">${totalStandard}</span></span>
      <span>Total: <b>${totalPassengers}</b></span>
    </div>
    <div class="report-actions">
      <button class="report-btn" onclick="pdfGroup(decodeURIComponent('${safeKey}'))">📄 PDF</button>
      <button class="report-btn email" onclick="emailGroup(decodeURIComponent('${safeKey}'))">✉️ Email</button>
    </div>
    <div style="margin-top:6px">
      ${g.items.map(r=>`<div style="padding:9px 0;border-top:1px solid #e1e5e7">
        <div class="row" style="gap:8px">
          <span style="min-width:0"><b>${r.station ? '📍 '+esc(r.station) : '📍 Station not entered'}</b><div class="note">🚆 ${esc(r.setType || 'Single set')}</div></span>
          <button class="delete-entry" title="Delete this entry" aria-label="Delete this saved count" onclick="deleteEntry('${esc(r.id)}')">×</button>
        </div>
        <div class="note">First: <span class="fc">${Number(r.first)||0}</span> • Standard: <span class="std">${Number(r.standard)||0}</span> • Total: <b>${Number(r.total)||0}</b></div>
        ${r.notes?`<div class="note">Notes: ${esc(r.notes)}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`;
}).join('');
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;state[k]=Math.max(0,state[k]+Number(b.dataset.d));render()});
['first','standard'].forEach(k=>$(k).addEventListener('input',()=>{let n=parseInt($(k).value,10);state[k]=Number.isFinite(n)&&n>=0?n:0;updateTotal();}));
['first','standard'].forEach(k=>$(k).addEventListener('blur',()=>{if($(k).value==='')state[k]=0;render();}));

}
